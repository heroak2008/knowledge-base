<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2310" viewBox="0 0 1600 2310" role="img" aria-labelledby="rel16-title"><title id="rel16-title">CoreALM-Next v1.17 模块协作关系</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#243e46}.title{font-size:30px;font-weight:650}.h{font-size:23px;font-weight:650}.b{font-size:19px;fill:#536b70}.n{font-size:17px;fill:#61797c}</style><rect width="1600" height="2310" fill="#fbfcf9"/><defs><marker id="rel16-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#527b75"/></marker></defs><text x="40" y="54" class="title">CoreALM-Next · 模块协作关系 v1.17</text><text x="40" y="92" class="b">同一模块按业务链路重复出现；只画主要传递，横向服务在末行统一说明。</text><rect x="24" y="124" width="1552" height="350" rx="12" fill="#eef5f0" stroke="#b5ccc1"/><text x="46" y="160" class="h">01  任务组织及执行</text><rect x="50" y="210" width="310" height="100" rx="10" fill="#fff" stroke="#9bbab1"/><text x="66" y="247" class="h">M1 作业空间</text><text x="66" y="285" class="b">提供有效范围与配置</text><rect x="445" y="210" width="310" height="100" rx="10" fill="#fff" stroke="#9bbab1"/><text x="461" y="247" class="h">M2 任务协同</text><text x="461" y="285" class="b">来源Task、关联及待办</text><rect x="840" y="210" width="310" height="100" rx="10" fill="#fff" stroke="#9bbab1"/><text x="856" y="247" class="h">M4 作业执行</text><text x="856" y="285" class="b">Agent Teams推进作业</text><rect x="1235" y="210" width="310" height="100" rx="10" fill="#fff" stroke="#9bbab1"/><text x="1251" y="247" class="h">M17 运行环境与资源</text><text x="1251" y="285" class="b">匹配镜像并分配环境</text><path d="M360 260H445" fill="none" stroke="#527b75" stroke-width="2"/><text x="402.5" y="245" class="n" text-anchor="middle">范围</text><path d="M755 260H840" fill="none" stroke="#527b75" stroke-width="2"/><text x="797.5" y="245" class="n" text-anchor="middle">执行</text><path d="M1150 260H1235" fill="none" stroke="#527b75" stroke-width="2"/><text x="1192.5" y="245" class="n" text-anchor="middle">环境需求</text><text x="50" y="365" class="b">M7同步来源Task；M2审核跨系统关联。M3按场景SOP给出衔接提示，不自动阻断。</text><text x="50" y="409" class="b">AI断点转M2人工待办；结果由用户确认，再经M7更新来源Task。M17回传实际环境。</text><rect x="24" y="502" width="1552" height="340" rx="12" fill="#eef5f0" stroke="#b5ccc1"/><text x="46" y="538" class="h">02  模型服务</text><rect x="50" y="588" width="310" height="100" rx="10" fill="#fff" stroke="#9bbab1"/><text x="66" y="625" class="h">M5 资产管理</text><text x="66" y="663" class="b">平台发布网关策略</text><rect x="445" y="588" width="310" height="100" rx="10" fill="#fff" stroke="#9bbab1"/><text x="461" y="625" class="h">M18 执行基线</text><text x="461" y="663" class="b">记录本次配置与条件</text><rect x="840" y="588" width="310" height="100" rx="10" fill="#fff" stroke="#9bbab1"/><text x="856" y="625" class="h">M10 产业MaaS网关</text><text x="856" y="663" class="b">按策略处理实际请求</text><rect x="1235" y="588" width="310" height="100" rx="10" fill="#fff" stroke="#9bbab1"/><text x="1251" y="625" class="h">公司MaaS网关</text><text x="1251" y="663" class="b">返回模型结果及用量</text><path d="M360 638H445" fill="none" stroke="#527b75" stroke-width="2"/><text x="402.5" y="623" class="n" text-anchor="middle">版本</text><path d="M755 638H840" fill="none" stroke="#527b75" stroke-width="2"/><text x="797.5" y="623" class="n" text-anchor="middle">配置引用</text><path d="M1150 638H1235" fill="none" stroke="#527b75" stroke-width="2"/><text x="1192.5" y="623" class="n" text-anchor="middle">调用</text><text x="50" y="747" class="b">M4发起执行，模型请求统一经过M10；实际处理、缓存、重试和模型版本进入M11。</text><text x="50" y="788" class="b">平台不做额度预留或准入；额度不足由供给侧返回失败，结果如实留存。</text><rect x="24" y="870" width="1552" height="390" rx="12" fill="#eef5f0" stroke="#b5ccc1"/><text x="46" y="906" class="h">03  构建验证：按产品配置选择路径</text><rect x="50" y="970" width="310" height="100" rx="10" fill="#fff" stroke="#9bbab1"/><text x="66" y="1007" class="h">M4 作业执行</text><text x="66" y="1045" class="b">Agent生成代码并发起验证</text><rect x="500" y="923" width="400" height="100" rx="10" fill="#fff" stroke="#9bbab1"/><text x="516" y="960" class="h">M7 研发系统接入</text><text x="516" y="998" class="b">调用已有CI/CD数字化能力</text><rect x="500" y="1080" width="400" height="100" rx="10" fill="#fff" stroke="#9bbab1"/><text x="516" y="1117" class="h">M17 运行环境与资源</text><text x="516" y="1155" class="b">专用构建镜像及池化环境</text><rect x="1150" y="1000" width="380" height="100" rx="10" fill="#fff" stroke="#9bbab1"/><text x="1166" y="1037" class="h">M4 作业执行</text><text x="1166" y="1075" class="b">接收验证结果并组织修正</text><path d="M360 1020H420V973H500M420 1020V1130H500" fill="none" stroke="#527b75" stroke-width="2"/><path d="M900 973H1020V1050H1150M900 1130H1020V1050" fill="none" stroke="#527b75" stroke-width="2"/><text x="50" y="1218" class="b">验证失败有限轮次返回Agent修正；人工断点需确认继续。无兼容节点不替换验证条件。</text><rect x="24" y="1288" width="1552" height="424" rx="12" fill="#eef5f0" stroke="#b5ccc1"/><text x="46" y="1324" class="h">04  数据飞轮：证据进入分析、实验和发布</text><rect x="50" y="1380" width="200" height="100" rx="10" fill="#fff" stroke="#9bbab1"/><text x="66" y="1417" class="h">M11 执行记录</text><text x="66" y="1455" class="b">事件与完整性</text><rect x="310" y="1380" width="200" height="100" rx="10" fill="#fff" stroke="#9bbab1"/><text x="326" y="1417" class="h">M8 运营分析</text><text x="326" y="1455" class="b">问题及建议</text><rect x="570" y="1380" width="200" height="100" rx="10" fill="#fff" stroke="#9bbab1"/><text x="586" y="1417" class="h">M13 持续改进</text><text x="586" y="1455" class="b">假设与立项</text><rect x="830" y="1380" width="200" height="100" rx="10" fill="#fff" stroke="#9bbab1"/><text x="846" y="1417" class="h">M12 评测实验</text><text x="846" y="1455" class="b">对照及报告</text><rect x="1090" y="1380" width="200" height="100" rx="10" fill="#fff" stroke="#9bbab1"/><text x="1106" y="1417" class="h">M6 质量管理</text><text x="1106" y="1455" class="b">审核和例外</text><rect x="1350" y="1380" width="200" height="100" rx="10" fill="#fff" stroke="#9bbab1"/><text x="1366" y="1417" class="h">M5 资产管理</text><text x="1366" y="1455" class="b">版本及发布</text><path d="M250 1430H310" fill="none" stroke="#527b75" stroke-width="2"/><text x="280.0" y="1415" class="n" text-anchor="middle">事实</text><path d="M510 1430H570" fill="none" stroke="#527b75" stroke-width="2"/><text x="540.0" y="1415" class="n" text-anchor="middle">建议</text><path d="M770 1430H830" fill="none" stroke="#527b75" stroke-width="2"/><text x="800.0" y="1415" class="n" text-anchor="middle">方案</text><path d="M1030 1430H1090" fill="none" stroke="#527b75" stroke-width="2"/><text x="1060.0" y="1415" class="n" text-anchor="middle">报告</text><path d="M1290 1430H1350" fill="none" stroke="#527b75" stroke-width="2"/><text x="1320.0" y="1415" class="n" text-anchor="middle">批准</text><rect x="50" y="1550" width="450" height="100" rx="10" fill="#fff" stroke="#9bbab1"/><text x="66" y="1587" class="h">M16 评测数据集</text><text x="66" y="1625" class="b">审核入集、冻结与独立验证</text><rect x="650" y="1550" width="450" height="100" rx="10" fill="#fff" stroke="#9bbab1"/><text x="666" y="1587" class="h">M18 执行基线</text><text x="666" y="1625" class="b">整次执行与Action条件</text><text x="1138" y="1589" class="b">M12经M4运行</text><text x="1138" y="1624" class="b">上线后回M8观察</text><rect x="24" y="1740" width="1552" height="285" rx="12" fill="#eef5f0" stroke="#b5ccc1"/><text x="46" y="1776" class="h">05  用量核对</text><rect x="50" y="1828" width="400" height="100" rx="10" fill="#fff" stroke="#9bbab1"/><text x="66" y="1865" class="h">M10 / 执行端 / 公司侧</text><text x="66" y="1903" class="b">分别提供原始计量记录</text><rect x="590" y="1828" width="400" height="100" rx="10" fill="#fff" stroke="#9bbab1"/><text x="606" y="1865" class="h">M14 用量统计</text><text x="606" y="1903" class="b">核对来源、差异及修订</text><rect x="1130" y="1828" width="400" height="100" rx="10" fill="#fff" stroke="#9bbab1"/><text x="1146" y="1865" class="h">M8 运营分析</text><text x="1146" y="1903" class="b">按场景和资产分析用量</text><path d="M450 1878H590" fill="none" stroke="#527b75" stroke-width="2"/><text x="520.0" y="1863" class="n" text-anchor="middle">记录</text><path d="M990 1878H1130" fill="none" stroke="#527b75" stroke-width="2"/><text x="1060.0" y="1863" class="n" text-anchor="middle">统计</text><text x="50" y="1980" class="b">Token/Credit分别保留口径；相同消耗不重复累加，缺失不填零。</text><rect x="24" y="2053" width="1552" height="220" rx="12" fill="#eef5f0" stroke="#b5ccc1"/><text x="46" y="2089" class="h">06  横向约束及观测</text><text x="50" y="2136" class="b">M9：iRight群组授权、发起用户身份、来源认证及审核分离。</text><text x="50" y="2180" class="b">M15：平台健康与资源遥测；M17据实际使用分析需求，资源不足经资源管理员审批扩容。</text><text x="50" y="2224" class="b">M11保留过程，M18保留条件；快照和产物归档由M17管理，M11/M18保存关联引用。</text><path d="M500 1600H550V1520H930V1482M875 1550V1536H970V1482" fill="none" stroke="#527b75" stroke-width="2"/><text x="620" y="1506" class="n">样本</text><text x="1002" y="1538" class="n">条件</text><polygon points="930,1482 924,1492 936,1492" fill="#527b75"/><polygon points="970,1482 964,1492 976,1492" fill="#527b75"/><polygon points="443.0,260.0 433.0,254.0 433.0,266.0" fill="#527b75"/><polygon points="838.0,260.0 828.0,254.0 828.0,266.0" fill="#527b75"/><polygon points="1233.0,260.0 1223.0,254.0 1223.0,266.0" fill="#527b75"/><polygon points="443.0,638.0 433.0,632.0 433.0,644.0" fill="#527b75"/><polygon points="838.0,638.0 828.0,632.0 828.0,644.0" fill="#527b75"/><polygon points="1233.0,638.0 1223.0,632.0 1223.0,644.0" fill="#527b75"/><polygon points="308.0,1430.0 298.0,1424.0 298.0,1436.0" fill="#527b75"/><polygon points="568.0,1430.0 558.0,1424.0 558.0,1436.0" fill="#527b75"/><polygon points="828.0,1430.0 818.0,1424.0 818.0,1436.0" fill="#527b75"/><polygon points="1088.0,1430.0 1078.0,1424.0 1078.0,1436.0" fill="#527b75"/><polygon points="1348.0,1430.0 1338.0,1424.0 1338.0,1436.0" fill="#527b75"/><polygon points="588.0,1878.0 578.0,1872.0 578.0,1884.0" fill="#527b75"/><polygon points="1128.0,1878.0 1118.0,1872.0 1118.0,1884.0" fill="#527b75"/><polygon points="498,973 488,967 488,979" fill="#527b75"/><polygon points="498,1130 488,1124 488,1136" fill="#527b75"/><polygon points="1148,1050 1138,1044 1138,1056" fill="#527b75"