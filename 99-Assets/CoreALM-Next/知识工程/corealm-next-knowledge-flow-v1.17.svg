<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1440" viewBox="0 0 1600 1440" role="img" aria-labelledby="knowledge17-title"><title id="knowledge17-title">知识发现、上下文装配、实际消费和评测改进</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="1600" height="1440" fill="#f7faf8"/><text x="36" y="54" font-size="31" fill="#35544e" font-weight="650">CoreALM-Next · 知识进入任务及改进的链路</text><text x="36" y="93" font-size="20" fill="#35544e" font-weight="400">正文分布维护，任务按需消费；候选、准备装载、实际装载和效果分别留痕。</text><rect x="24" y="125" width="1552" height="92" rx="10" fill="#fff" stroke="#a8c3b5"/><text x="40" y="161" font-size="23" fill="#35544e" font-weight="650">M9 贯穿校验：iRight、来源权限、发起用户</text><text x="44" y="194" font-size="19" fill="#35544e" font-weight="400">发现、读取、装载、缓存和输出均校验；公共账号不能扩大用户范围。</text><rect x="24" y="250" width="1552" height="250" rx="12" fill="#eaf2ed" stroke="#bdd0c4"/><text x="44" y="289" font-size="24" fill="#35544e" font-weight="650">01  来源接入与发现</text><rect x="24" y="540" width="1552" height="310" rx="12" fill="#eaf2ed" stroke="#bdd0c4"/><text x="44" y="579" font-size="24" fill="#35544e" font-weight="650">02  任务上下文装配与实际消费</text><rect x="24" y="890" width="1552" height="380" rx="12" fill="#eaf2ed" stroke="#bdd0c4"/><text x="44" y="929" font-size="24" fill="#35544e" font-weight="650">03  证据驱动评测，人工确认后发布</text><rect x="50" y="325" width="400" height="126" rx="10" fill="#fff" stroke="#a8c3b5"/><text x="66" y="361" font-size="23" fill="#35544e" font-weight="650">已有知识来源</text><text x="66" y="396" font-size="18" fill="#35544e" font-weight="400">代码仓SPEC/契约、共享文档</text><text x="66" y="427" font-size="18" fill="#35544e" font-weight="400">云见正式经验；保留原生权威</text><rect x="590" y="325" width="400" height="126" rx="10" fill="#fff" stroke="#a8c3b5"/><text x="606" y="361" font-size="23" fill="#35544e" font-weight="650">M7 接入与修订解析</text><text x="606" y="396" font-size="18" fill="#35544e" font-weight="400">读取回执、状态、修订和变化</text><text x="606" y="427" font-size="18" fill="#35544e" font-weight="400">删除、撤权、失败明确回报</text><rect x="1130" y="325" width="400" height="126" rx="10" fill="#fff" stroke="#a8c3b5"/><text x="1146" y="361" font-size="23" fill="#35544e" font-weight="650">M5 知识目录和索引</text><text x="1146" y="396" font-size="18" fill="#35544e" font-weight="400">主题导航、版本及适用范围</text><text x="1146" y="427" font-size="18" fill="#35544e" font-weight="400">派生产物可重建，不替代原文</text><path d="M450 388H590" stroke="#608778" stroke-width="2" fill="none"/><polygon points="588,388 578,382 578,394" fill="#608778"/><text x="504.0" y="372" font-size="16" fill="#35544e" font-weight="400">读取</text><path d="M990 388H1130" stroke="#608778" stroke-width="2" fill="none"/><polygon points="1128,388 1118,382 1118,394" fill="#608778"/><text x="1044.0" y="372" font-size="16" fill="#35544e" font-weight="400">观察</text><rect x="50" y="625" width="310" height="135" rx="10" fill="#fff" stroke="#a8c3b5"/><text x="66" y="661" font-size="23" fill="#35544e" font-weight="650">M2/M4 任务目标</text><text x="66" y="696" font-size="18" fill="#35544e" font-weight="400">Task、SR/Issue、目标版本</text><text x="66" y="727" font-size="18" fill="#35544e" font-weight="400">Agent职责及所需知识</text><rect x="445" y="625" width="310" height="135" rx="10" fill="#fff" stroke="#a8c3b5"/><text x="461" y="661" font-size="23" fill="#35544e" font-weight="650">M5 选择与片段装配</text><text x="461" y="696" font-size="18" fill="#35544e" font-weight="400">先限定权限、版本和状态</text><text x="461" y="727" font-size="18" fill="#35544e" font-weight="400">记录排除及冲突理由</text><rect x="840" y="625" width="310" height="135" rx="10" fill="#fff" stroke="#a8c3b5"/><text x="856" y="661" font-size="23" fill="#35544e" font-weight="650">M18 准备执行基线</text><text x="856" y="696" font-size="18" fill="#35544e" font-weight="400">锁定来源修订、片段和顺序</text><text x="856" y="727" font-size="18" fill="#35544e" font-weight="400">prepared尚不等于消费</text><rect x="1235" y="625" width="310" height="135" rx="10" fill="#fff" stroke="#a8c3b5"/><text x="1251" y="661" font-size="23" fill="#35544e" font-weight="650">M4 实际装载</text><text x="1251" y="696" font-size="18" fill="#35544e" font-weight="400">装载时重验权限和状态</text><text x="1251" y="727" font-size="18" fill="#35544e" font-weight="400">成功/失败/unknown分开</text><path d="M360 691H445" stroke="#608778" stroke-width="2" fill="none"/><polygon points="443,691 433,685 433,697" fill="#608778"/><text x="386.5" y="675" font-size="16" fill="#35544e" font-weight="400">请求</text><path d="M755 691H840" stroke="#608778" stroke-width="2" fill="none"/><polygon points="838,691 828,685 828,697" fill="#608778"/><text x="781.5" y="675" font-size="16" fill="#35544e" font-weight="400">方案</text><path d="M1150 691H1235" stroke="#608778" stroke-width="2" fill="none"/><polygon points="1233,691 1223,685 1223,697" fill="#608778"/><text x="1176.5" y="675" font-size="16" fill="#35544e" font-weight="400">条件</text><text x="50" y="804" font-size="20" fill="#35544e" font-weight="400">装载回执 → M18追加actual清单 → M11追加消费事件；Action后续变化不覆盖前次基线。</text><rect x="45" y="982" width="210" height="146" rx="10" fill="#fff" stroke="#a8c3b5"/><text x="61" y="1018" font-size="23" fill="#35544e" font-weight="650">M11 执行记录</text><text x="61" y="1053" font-size="18" fill="#35544e" font-weight="400">引用、采纳及验证</text><text x="61" y="1084" font-size="18" fill="#35544e" font-weight="400">保留缺失和反例</text><rect x="300" y="982" width="210" height="146" rx="10" fill="#fff" stroke="#a8c3b5"/><text x="316" y="1018" font-size="23" fill="#35544e" font-weight="650">M8 运营分析</text><text x="316" y="1053" font-size="18" fill="#35544e" font-weight="400">质量、耗时、用量</text><text x="316" y="1084" font-size="18" fill="#35544e" font-weight="400">不能只看引用次数</text><rect x="555" y="982" width="210" height="146" rx="10" fill="#fff" stroke="#a8c3b5"/><text x="571" y="1018" font-size="23" fill="#35544e" font-weight="650">M13 改进立项</text><text x="571" y="1053" font-size="18" fill="#35544e" font-weight="400">人工确认问题假设</text><text x="571" y="1084" font-size="18" fill="#35544e" font-weight="400">早期可用已有Task</text><rect x="810" y="982" width="210" height="146" rx="10" fill="#fff" stroke="#a8c3b5"/><text x="826" y="1018" font-size="23" fill="#35544e" font-weight="650">M12 评测实验</text><text x="826" y="1053" font-size="18" fill="#35544e" font-weight="400">固定变量隔离比较</text><text x="826" y="1084" font-size="18" fill="#35544e" font-weight="400">全任务回归</text><rect x="1065" y="982" width="210" height="146" rx="10" fill="#fff" stroke="#a8c3b5"/><text x="1081" y="1018" font-size="23" fill="#35544e" font-weight="650">M6 质量审核</text><text x="1081" y="1053" font-size="18" fill="#35544e" font-weight="400">报告和证据审核</text><text x="1081" y="1084" font-size="18" fill="#35544e" font-weight="400">不得覆盖当前权限</text><rect x="1320" y="982" width="210" height="146" rx="10" fill="#fff" stroke="#a8c3b5"/><text x="1336" y="1018" font-size="23" fill="#35544e" font-weight="650">M5 发布</text><text x="1336" y="1053" font-size="18" fill="#35544e" font-weight="400">新版本待确认采用</text><text x="1336" y="1084" font-size="18" fill="#35544e" font-weight="400">上线后观察</text><path d="M255 1050H300" stroke="#608778" stroke-width="2" fill="none"/><polygon points="298,1050 288,1044 288,1056" fill="#608778"/><path d="M510 1050H555" stroke="#608778" stroke-width="2" fill="none"/><polygon points="553,1050 543,1044 543,1056" fill="#608778"/><path d="M765 1050H810" stroke="#608778" stroke-width="2" fill="none"/><polygon points="808,1050 798,1044 798,1056" fill="#608778"/><path d="M1020 1050H1065" stroke="#608778" stroke-width="2" fill="none"/><polygon points="1063,1050 1053,1044 1053,1056" fill="#608778"/><path d="M1275 1050H1320" stroke="#608778" stroke-width="2" fill="none"/><polygon points="1318,1050 1308,1044 1308,1056" fill="#608778"/><rect x="45" y="1160" width="720" height="78" rx="10" fill="#f7faf8" stroke="#a8c3b5"/><text x="61" y="1196" font-size="23" fill="#35544e" font-weight="650">M16：人工审核样本、冻结版本、独立验证集</text><rect x="810" y="1160" width="720" height="78" rx="10" fill="#f7faf8" stroke="#a8c3b5"/><text x="826" y="1196" font-size="23" fill="#35544e" font-weight="650">M14：知识处理与Agent Teams总Token/Credit</text><text x="36" y="1330" font-size="20" fill="#35544e" font-weight="400">首批：显式导航 + 文本搜索 + 规则式片段选择 + 装载证据；增强检索先验证再引入。</text><text x="36" y="1370" font-size="19" fill="#35544e" font-weight="400">M5发布的方法资产与普通源文分开；M17提供真实验证环境，M15观测同步与装配健康。</text></svg>