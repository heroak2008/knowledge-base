<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1810" viewBox="0 0 1500 1810" role="img" aria-labelledby="map16-title"><title id="map16-title">CoreALM-Next v1.17 功能模块划分</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#243e46}.title{font-size:30px;font-weight:650}.h{font-size:23px;font-weight:650}.b{font-size:19px;fill:#536b70}.n{font-size:17px;fill:#61797c}</style><rect width="1500" height="1810" fill="#fbfcf9"/><text x="40" y="54" class="title">CoreALM-Next · 功能模块划分 v1.17</text><text x="40" y="91" class="b">18个逻辑模块；按管理对象和决定划分，开发责任组可承担多个模块</text><rect x="24" y="130" width="1452" height="240" rx="12" fill="#eef5f0" stroke="#b5ccc1"/><text x="44" y="166" class="h">01  作业组织</text><rect x="44" y="187" width="444" height="160" rx="9" fill="white" stroke="#9bbab1"/><text x="62" y="227" class="h">M1 作业空间</text><text x="62" y="268" class="b">单父空间、范围、订阅</text><text x="62" y="302" class="b">差异确认、迁移和归档恢复</text><rect x="528" y="187" width="444" height="160" rx="9" fill="white" stroke="#9bbab1"/><text x="546" y="227" class="h">M2 任务协同</text><text x="546" y="268" class="b">独立Task、关联规则及审核</text><text x="546" y="302" class="b">用户操作、同步和数量汇总</text><rect x="1012" y="187" width="444" height="160" rx="9" fill="white" stroke="#9bbab1"/><text x="1030" y="227" class="h">M3 依赖管理</text><text x="1030" y="268" class="b">基于场景SOP分析衔接</text><text x="1030" y="302" class="b">仅提示；范围待场景验证</text><rect x="24" y="390" width="1452" height="240" rx="12" fill="#f0f3f7" stroke="#b5ccc1"/><text x="44" y="426" class="h">02  执行支撑</text><rect x="44" y="447" width="444" height="160" rx="9" fill="white" stroke="#9bbab1"/><text x="62" y="487" class="h">M4 作业执行</text><text x="62" y="528" class="b">Agent Teams执行和人工断点</text><text x="62" y="562" class="b">构建验证闭环、结果确认</text><rect x="528" y="447" width="444" height="160" rx="9" fill="white" stroke="#9bbab1"/><text x="546" y="487" class="h">M17 运行环境与资源</text><text x="546" y="528" class="b">构建镜像、CPU/内存/存储</text><text x="546" y="562" class="b">池化环境、审批扩容和快照</text><rect x="1012" y="447" width="444" height="160" rx="9" fill="white" stroke="#9bbab1"/><text x="1030" y="487" class="h">M18 执行基线</text><text x="1030" y="528" class="b">整次执行及Action级条件</text><text x="1030" y="562" class="b">冻结、变化记录和派生关系</text><rect x="24" y="650" width="1452" height="240" rx="12" fill="#eef5f0" stroke="#b5ccc1"/><text x="44" y="686" class="h">03  资产质量</text><rect x="44" y="707" width="444" height="160" rx="9" fill="white" stroke="#9bbab1"/><text x="62" y="747" class="h">M5 资产管理</text><text x="62" y="788" class="b">知识目录、装配规则及版本</text><text x="62" y="822" class="b">审核发布、归档和共享</text><rect x="528" y="707" width="444" height="160" rx="9" fill="white" stroke="#9bbab1"/><text x="546" y="747" class="h">M6 质量管理</text><text x="546" y="788" class="b">标准、检查、审核和例外</text><text x="546" y="822" class="b">资产及AI结果；不验收SR</text><rect x="1012" y="707" width="444" height="160" rx="9" fill="white" stroke="#9bbab1"/><text x="1030" y="747" class="h">M16 评测数据集</text><text x="1030" y="788" class="b">样本、标签及数据集版本</text><text x="1030" y="822" class="b">审核入集、独立验证和撤回</text><rect x="24" y="910" width="1452" height="240" rx="12" fill="#f0f3f7" stroke="#b5ccc1"/><text x="44" y="946" class="h">04  分析改进</text><rect x="44" y="967" width="444" height="160" rx="9" fill="white" stroke="#9bbab1"/><text x="62" y="1007" class="h">M8 运营分析</text><text x="62" y="1048" class="b">使用、质量、消耗和效果</text><text x="62" y="1082" class="b">默认口径、比较及证据下钻</text><rect x="528" y="967" width="444" height="160" rx="9" fill="white" stroke="#9bbab1"/><text x="546" y="1007" class="h">M12 评测实验</text><text x="546" y="1048" class="b">人工确认的对照实验</text><text x="546" y="1082" class="b">隔离运行、报告和建议</text><rect x="1012" y="967" width="444" height="160" rx="9" fill="white" stroke="#9bbab1"/><text x="1030" y="1007" class="h">M13 持续改进管理</text><text x="1030" y="1048" class="b">问题、假设及改进推进</text><text x="1030" y="1082" class="b">上线观察后关闭或回退</text><rect x="24" y="1170" width="1452" height="240" rx="12" fill="#eef5f0" stroke="#b5ccc1"/><text x="44" y="1206" class="h">05  接入服务</text><rect x="44" y="1227" width="444" height="160" rx="9" fill="white" stroke="#9bbab1"/><text x="62" y="1267" class="h">M7 研发系统接入</text><text x="62" y="1308" class="b">builtin连接器及数据映射</text><text x="62" y="1342" class="b">用户身份调用、回执和查证</text><rect x="528" y="1227" width="444" height="160" rx="9" fill="white" stroke="#9bbab1"/><text x="546" y="1267" class="h">M9 访问控制</text><text x="546" y="1308" class="b">iRight群组及用户身份</text><text x="546" y="1342" class="b">对象授权、认证引用和审计</text><rect x="1012" y="1227" width="444" height="160" rx="9" fill="white" stroke="#9bbab1"/><text x="1030" y="1267" class="h">M10 产业MaaS网关</text><text x="1030" y="1308" class="b">平台专属策略、缓存和路由</text><text x="1030" y="1342" class="b">双网关、重试及调用回执</text><rect x="24" y="1430" width="1452" height="240" rx="12" fill="#f0f3f7" stroke="#b5ccc1"/><text x="44" y="1466" class="h">06  记录观测</text><rect x="44" y="1487" width="444" height="160" rx="9" fill="white" stroke="#9bbab1"/><text x="62" y="1527" class="h">M11 执行记录</text><text x="62" y="1568" class="b">追加事件及产物/快照引用</text><text x="62" y="1602" class="b">双向追溯和完整性标记</text><rect x="528" y="1487" width="444" height="160" rx="9" fill="white" stroke="#9bbab1"/><text x="546" y="1527" class="h">M14 用量统计</text><text x="546" y="1568" class="b">Token/Credit归集及核对</text><text x="546" y="1602" class="b">保留来源和修订；不做额度</text><rect x="1012" y="1487" width="444" height="160" rx="9" fill="white" stroke="#9bbab1"/><text x="1030" y="1527" class="h">M15 平台监控</text><text x="1030" y="1568" class="b">服务及资源使用观测</text><text x="1030" y="1602" class="b">平台告警、故障处理和恢复</text><text x="44" y="1737" class="n">数据只有一个维护模块；通过查询、命令和回执协作。M3先保留分析提示范围。</text><text x="44" y="1770" class="n">M14不处理金额或额度准入；M17负责资源容量，运行中扩容须审批。</text></svg>