<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1640" viewBox="0 0 1600 1640" role="img" aria-labelledby="sys16-title"><title id="sys16-title">CoreALM-Next系统架构：工作台、执行、平台服务、数据闭环和既有基础设施</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect x="0" y="0" width="1600" height="1640" rx="0" fill="#f7faf8" stroke="#f7faf8"/><text x="36" y="54" font-size="32" font-weight="650" fill="#1e3e44">CoreALM-Next · 系统架构</text><text x="36" y="91" font-size="20" font-weight="400" fill="#3d5559">围绕任务执行组织平台能力，复用已有作业系统和基础设施；图示为逻辑架构。</text><rect x="200" y="125" width="1376" height="70" rx="12" fill="#edf2ef" stroke="#d0ded8"/><text x="888" y="169" font-size="23" font-weight="550" fill="#294d4c" text-anchor="middle">研发用户  ·  产业管理员 / 资产维护者  ·  CMO  ·  资源管理员</text><rect x="24" y="225" width="1552" height="860" rx="18" fill="#eff5f2" stroke="#b2ccc1"/><text x="44" y="252" font-size="19" font-weight="650" fill="#2b6158">CoreALM-Next 平台</text><rect x="44" y="278" width="132" height="437" rx="12" fill="#e4eeeb" stroke="#a6beb6"/><text x="110" y="322" font-size="25" font-weight="650" fill="#24574f" text-anchor="middle">M9</text><text x="110" y="358" font-size="22" font-weight="600" fill="#24574f" text-anchor="middle">访问控制</text><text x="110" y="412" font-size="18" font-weight="400" fill="#3d5559" text-anchor="middle">iRight群组</text><text x="110" y="450" font-size="18" font-weight="400" fill="#3d5559" text-anchor="middle">操作及范围</text><text x="110" y="488" font-size="18" font-weight="400" fill="#3d5559" text-anchor="middle">用户认证</text><text x="110" y="526" font-size="18" font-weight="400" fill="#3d5559" text-anchor="middle">审核分离</text><text x="110" y="564" font-size="18" font-weight="400" fill="#3d5559" text-anchor="middle">全程追溯</text><rect x="44" y="755" width="132" height="290" rx="12" fill="#e9eef4" stroke="#b3c4d4"/><text x="110" y="800" font-size="25" font-weight="650" fill="#36566c" text-anchor="middle">M15</text><text x="110" y="836" font-size="22" font-weight="600" fill="#36566c" text-anchor="middle">平台监控</text><text x="110" y="885" font-size="18" font-weight="400" fill="#3d5559" text-anchor="middle">服务健康</text><text x="110" y="923" font-size="18" font-weight="400" fill="#3d5559" text-anchor="middle">资源遥测</text><text x="110" y="961" font-size="18" font-weight="400" fill="#3d5559" text-anchor="middle">告警及恢复</text><rect x="200" y="278" width="880" height="140" rx="12" fill="#fff" stroke="#b6cbc8"/><text x="224" y="312" font-size="21" font-weight="600" fill="#244a46">工作台入口</text><rect x="224" y="330" width="260" height="66" rx="8" fill="#f3f7f5" stroke="#d5e2dc"/><text x="238" y="358" font-size="20" font-weight="600" fill="#3d5559">M1 作业空间</text><text x="238" y="383" font-size="16" font-weight="400" fill="#3d5559">范围 / 订阅 / 配置</text><rect x="510" y="330" width="260" height="66" rx="8" fill="#f3f7f5" stroke="#d5e2dc"/><text x="524" y="358" font-size="20" font-weight="600" fill="#3d5559">M2 任务协同</text><text x="524" y="383" font-size="16" font-weight="400" fill="#3d5559">关联 / 操作 / 进展</text><rect x="796" y="330" width="260" height="66" rx="8" fill="#f3f7f5" stroke="#d5e2dc"/><text x="810" y="358" font-size="20" font-weight="600" fill="#3d5559">M3 依赖管理</text><text x="810" y="383" font-size="16" font-weight="400" fill="#3d5559">SOP衔接提示</text><path d="M640 195L640 225" fill="none" stroke="#7a958c" stroke-width="2.2"/><polygon points="640,225 634,214 646,214" fill="#7a958c"/><path d="M640 418L640 468" fill="none" stroke="#62877f" stroke-width="2.2"/><polygon points="640,468 634,457 646,457" fill="#62877f"/><text x="660" y="450" font-size="17" font-weight="400" fill="#3d5559">任务及采用配置</text><rect x="200" y="468" width="880" height="285" rx="12" fill="#e5efeb" stroke="#93b5a7"/><text x="224" y="506" font-size="22" font-weight="650" fill="#244a46">执行中枢</text><rect x="224" y="526" width="490" height="203" rx="12" fill="#fff" stroke="#b6cbc8"/><text x="244" y="562" font-size="24" font-weight="650" fill="#244a46">M4 作业执行</text><text x="244" y="602" font-size="20" font-weight="400" fill="#3d5559">Agent Teams：分工、并行、分支、修正</text><rect x="244" y="624" width="142" height="42" rx="6" fill="#eef5f1" stroke="#c3d7ca"/><text x="315" y="651" font-size="18" font-weight="500" fill="#3d5559" text-anchor="middle">AI作业</text><rect x="398" y="624" width="142" height="42" rx="6" fill="#eef5f1" stroke="#c3d7ca"/><text x="469" y="651" font-size="18" font-weight="500" fill="#3d5559" text-anchor="middle">数字化作业</text><rect x="552" y="624" width="142" height="42" rx="6" fill="#eef5f1" stroke="#c3d7ca"/><text x="623" y="651" font-size="18" font-weight="500" fill="#3d5559" text-anchor="middle">人工断点</text><text x="244" y="703" font-size="18" font-weight="400" fill="#3d5559">单Task单活跃执行 · 用户确认结果</text><rect x="758" y="526" width="298" height="203" rx="12" fill="#fff" stroke="#b6cbc8"/><text x="776" y="562" font-size="22" font-weight="650" fill="#244a46">M17 运行环境与资源</text><text x="776" y="604" font-size="18" font-weight="400" fill="#3d5559">专用构建镜像 / 兼容节点</text><text x="776" y="643" font-size="18" font-weight="400" fill="#3d5559">CPU / 内存 / 存储池化</text><text x="776" y="682" font-size="18" font-weight="400" fill="#3d5559">审批扩容 / 快照 / 回收</text><path d="M420 753L420 850" fill="none" stroke="#62877f" stroke-width="2.2"/><polygon points="420,850 414,839 426,839" fill="#62877f"/><text x="438" y="805" font-size="18" font-weight="400" fill="#3d5559">数字化调用</text><path d="M870 753L870 850" fill="none" stroke="#62877f" stroke-width="2.2"/><polygon points="870,850 864,839 876,839" fill="#62877f"/><text x="888" y="805" font-size="18" font-weight="400" fill="#3d5559">模型调用</text><rect x="224" y="850" width="410" height="156" rx="12" fill="#fff" stroke="#b6cbc8"/><text x="244" y="891" font-size="24" font-weight="650" fill="#244a46">M7 研发系统接入</text><text x="244" y="932" font-size="20" font-weight="400" fill="#3d5559">平台builtin连接器</text><text x="244" y="969" font-size="18" font-weight="400" fill="#3d5559">映射、用户身份调用、同步及回执</text><rect x