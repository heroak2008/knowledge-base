/* Shared coordination views: retain the existing light/dark palette. */
.coordination-pad{padding:20px}.coordination-pad p,.gov-gate p{line-height:1.8}.gov-case footer{flex-wrap:wrap;gap:7px}.gov-decided-item p{overflow-wrap:anywhere}.asset-card footer{flex-wrap:wrap;gap:8px}.asset-scope-bar{flex-wrap:wrap;padding:12px 0}.asset-scope-bar .select{width:auto;max-width:100%}.task-action-dock{position:sticky;top:64px;z-index:12;background:var(--bg,#fff);padding:0 0 8px;border-bottom:1px solid var(--line);margin-bottom:18px}.task-action-dock .run-controls{margin:0;gap:12px;flex-wrap:wrap}.task-action-dock>p{margin:7px 4px 0;font-size:11px!important}.task-action-dock .switch{font-size:12px}.task-summary{font-size:12px!important;line-height:1.9}.subtitle,.context-list,.discussion-comment-body{line-height:1.85}.status-dim .tiny,.task-aside .tiny{font-size:11px}.coordination-pad .detail-pairs{margin-top:16px}.asset-scope-bar label{font-size:12px;font-weight:600}.gov-gate .gov-decided-item{margin-top:16px;padding:12px;border-top:1px solid var(--line)}
@media(max-width:760px){.task-action-dock{top:60px}.task-action-dock .run-controls>.flex{width:100%}.task-action-dock .run-controls .btn{width:100%}.task-action-dock .switch{font-size:11px}.task-action-dock>p{font-size:10px!important}.coordination-pad{padding:16px}.asset-scope-bar .select{width:100%}.gov-case footer .btn{white-space:normal}.status-dim .tiny{font-size:10px}}
/* Requirement source hierarchy: desktop information relationships, shared palette. */

// Space management (minimal JSON editor, v0.5 非目标2 boundary):

const REGISTRY_KEY='corealm-space-registry-v1';
function loadRegistryOverride(){try{const o=JSON.parse(localStorage.getItem(REGISTRY_KEY)||'null');if(o&&Array.isArray(o.spaces)&&o.spaces.length){Object.assign(mainSpaceRegistry,o);}}catch{}}

function validateRegistry(reg){
 if(!reg||!Array.isArray(reg.spaces)||!reg.spaces.length)return 'spaces 必须是非空数组';
 const ids=new Set();
 for(const ms of reg.spaces){
  if(!ms.id||!ms.name||ms.kind!=='product')return `主空间 ${ms.id||'(缺id)'} 缺少 id/name 或 kind≠product`;
  if(ids.has(ms.id))return `主空间 id 重复：${ms.id}`;ids.add(ms.id);
  if(!ms.productScope||!ms.productScope.version)return `主空间 ${ms.id} 缺少 productScope.version`;
  if(!Array.isArray(ms.subSpaces)||!ms.subSpaces.length)return `主空间 ${ms.id} 至少需要一个子空间`;
  const subIds=new Set();
  for(const sub of ms.subSpaces){
   if(!sub.id||!sub.name||!sub.group)return `子空间 ${sub.id||'(缺id)'} 缺少 id/name/group`;
   if(subIds.has(sub.id))return `子空间 id 重复（${ms.id}内）：${sub.id}`;subIds.add(sub.id);
  }
 }
 if(!reg.spaces.some(ms=>ms.id===sessionContext.currentMainSpaceId))return '当前主空间不在新配置中；请先切换到保留的主空间';
 return null;
}
function saveRegistryOverride(json){
 let reg;try{reg=JSON.parse(json);}catch(e){return 'JSON 解析失败：'+e.message;}
 const err=validateRegistry(reg);if(err)return err;
 Object.assign(mainSpaceRegistry,{spaces:reg.spaces,mainSpaceId:reg.spaces[0].id});
 try{localStorage.setItem(REGISTRY_KEY,JSON.stringify({spaces:reg.spaces}));}catch{}
 refreshMainSpaceAdapters(currentMainSpace());
 ensureMainSpaceSlice(currentMainSpace());
 persist();render();
 return null;
}
function resetRegistryOverride(){
 try{localStorage.removeItem(REGISTRY_KEY);}catch{}
 location.reload();
}

function dependencyGraph(){const work=graphNodes.filter(n=>n.work),done=work.filter(n=>graphFacts(n.id).status==='done').length,blocked=work.filter(n=>graphFacts(n.id).status==='waiting').length;return `<section class="dependency-workspace ${view.graphExpanded?'graph-expanded':''}"><div class="dg-summary"><div><h2>RR-110 · 需求完整依赖图</h2><p>14个作业环节 + 2项依赖资源 · 完成统计不包含资源就绪</p></div><div class="dg-summary-count"><b>${done}<small>/14</small></b><span>已完成环节</span><i></i><b class="text-amber">${blocked}</b><span>等待前置</span></div></div><div class="dg-toolbar"><div class="flex wrap"><select id="graph-scope" class="select" aria-label="依赖图范围"><option value="all" ${view.graphScope!=='related'?'selected':''}>当前需求全链路</option><option value="related" ${view.graphScope==='related'?'selected':''}>突出07b上下游</option></select><label class="switch"><input id="graph-feedback" type="checkbox" ${view.graphFeedback?'checked':''}>优化反馈</label></div><div class="flex"><button class="btn small" data-action="graph-zoom" data-value="out" aria-label="缩小依赖图">−</button><span class="tiny muted" id="graph-zoom-label">${Math.round((view.graphZoom||1)*100)}%</span><button class="btn small" data-action="graph-zoom" data-value="in" aria-label="放大依赖图">+</button>${button('适应宽度','graph-fit','small')}${button('全图概览','graph-fit-all','small')}${button('定位07b','graph-locate','small')}${button(icon('external')+(view.graphExpanded?'收起':'展开'),'graph-fullscreen','small')}</div></div><div class="dg-legend"><span><i class="done"></i>已完成 / 资源可用</span><span><i class="running"></i>进行中</span><span><i class="waiting"></i>等待 / 待确认</span><span><i class="stale"></i>待重验证</span><span><i class="current"></i>当前任务</span></div><div class="dg-layout"><div class="dg-viewport" id="graph-viewport" tabindex="0" aria-label="可滚动的完整依赖图"><div class="dg-canvas ${view.graphFitAll?'dg-fit-all':''}" style="width:${Math.round((view.graphZoom||1)*100)}%">${graphSvg()}</div></div>${graphDetail()}</div><div class="panel-foot">完成记录、输入适用性、执行结果分别解释；图中状态为当前原型的演示事实。当前需求的全链路不等于整个R2.8版本的所有任务。</div></section><details class="dg-ledger"><summary>按环节查看完成情况与证据 · ${done}/14已完成</summary><div class="table-scroll"><table class="data-table"><thead><tr><th>环节</th><th>状态</th><th>责任</th><th>证据 / 阻塞</th></tr></thead><tbody>${work.map(n=>{const f=graphFacts(n.id);return `<tr class="row-link" tabindex="0" data-action="graph-node" data-value="${n.id}"><td>${n.code} ${n.label}</td><td>${badge(graphName[f.status],f.status==='done'?'green':f.status==='stale'?'red':'amber')}</td><td>${esc(n.owner)}</td><td>${esc(executionNote(f.evidence))}</td></tr>`;}).join('')}</tbody></table></div></details>`;}
function graphSelect(id){view.graphNode=id;const viewport=document.getElementById('graph-viewport');const pos=viewport?{top:viewport.scrollTop,left:viewport.scrollLeft}:null;render();if(pos){const next=document.getElementById('graph-viewport');if(next){next.scrollTop=pos.top;next.scrollLeft=pos.left;}}}
function graphCompleteModal(id){const n=graphNodes.find(n=>n.id===id),f=graphFacts(id);if(!n)return;const allowed=!!f.can;modal(`${n.code} ${n.label} · 完成条件`,`<p>${esc(f.detail)}</p><dl class="detail-pairs"><dt>责任人</dt><dd>${esc(n.owner)}</dd><dt>当前状态</dt><dd>${graphName[f.status]}</dd><dt>证据</dt><dd>${esc(executionNote(f.evidence))}</dd></dl><h3>所需前置</h3>${graphReadinessList(id)}<div class="callout mt">${icon('info')}此按钮模拟接收责任人确认的来源回执，不是当前用户替其他角色审批。${allowed?'演示前置已齐备，可以接收完成回执。':'依赖未齐备，不能提前标记完成。'}</div>`,button('关闭','close-modal')+button('接收完成回执（演示）','graph-confirm','primary',`data-value="${id}" ${allowed?'':'disabled'}`));}
function graphComplete(id){const f=graphFacts(id);if(!f.can){toast('前置未齐备，不能完成此环节。');return;}const g={...state.graphProgress,[id]:true,revisions:{...state.graphProgress?.revisions,[id]:state.specRevision}};state.graphProgress=g;event('依赖图关联环节已确认',`${graphNodes.find(n=>n.id===id).code} · 来源完成回执已接收（演示）`);closeModal();render();toast(id==='execute'?'测试批次已完成；需求最终验收与版本交付仍分别确认。':'完成情况已更新，相关下游重新计算就绪。');}

};
let workflowDetailView={tab:'steps',step:0};
function workflowAssetRelationship(){return `<div class="asset-relationship" aria-label="三类资产的关系"><button data-action="asset-detail" data-value="0"><span class="aw-rel-no">01</span><strong>场景组合</strong><small>装配哪些资产与版本</small></button><span class="aw-rel-sign">包含 / 引用</span><button data-action="asset-detail" data-value="1"><span class="aw-rel-no">02</span><strong>小队</strong><small>由谁分工、协调执行</small></button><span class="aw-rel-sign">按任务使用</span><button data-action="harness-detail"><span class="aw-rel-no">03</span><strong>Harness Workflow</strong><small>步骤、契约与恢复规则</small></button></div>`;}
function workflowTabs(){return tabs([['steps','执行步骤'],['contract','输入输出与产物'],['recovery','异常与人工控制'],['bindings','依赖与绑定'],['release','评测与版本']],workflowDetailView.tab,'workflow-tab');}
function workflowStepBody(){const w=featureDebugWorkflow,s=w.steps[workflowDetailView.step];return `<ol class="aw-steps" aria-label="feature-debug的五个主步骤">${w.steps.map((step,i)=>`<li><button data-action="workflow-step" data-value="${i}" class="${workflowDetailView.step===i?'selected':''}" aria-pressed="${workflowDetailView.step===i}"><span>${String(i+1).padStart(2,'0')}</span><strong>${step.title}</strong><small>${i===4?'人工中断点':'受控执行步骤'}</small></button></li>`).join('')}</ol><section class="aw-step-detail" aria-live="polite"><div class="between mb"><h3>${String(workflowDetailView.step+1).padStart(2,'0')} · ${s.title}</h3>${badge(workflowDetailView.step===4?'等待人工决定':'流程定义','outline')}</div><dl class="detail-pairs"><dt>执行者</dt><dd>${s.actor}</dd><dt>输入</dt><dd>${s.input}</dd><dt>工具能力</dt><dd>${s.capability}</dd><dt>输出</dt><dd>${s.output}</dd><dt>通过条件</dt><dd>${s.pass}</dd><dt>失败去向</dt><dd>${s.fail}</dd></dl><div class="callout">${icon('info')}<span>${s.note}</span></div></section><div class="aw-rule-strip"><strong>异常分支</strong><span>任一步失败均按错误类型分流，见“异常与人工控制”。</span>${button('查看处理规则','workflow-tab','small','data-value="recovery"')}</div>`;}
function workflowContractBody(){return `<div class="info-grid"><section class="info-box"><h3>必需输入</h3><ul class="aw-list"><li>WorkItem、目标特性及验收规格的固定修订</li><li>特性脚本清单、提交摘要及断言规则</li><li>开发正式转测记录与目标产品包摘要</li><li>个人环境的实际版本和组网证据</li><li>空间授权、工具能力、额度与运行约束</li></ul></section><section class="info-box"><h3>标准输出</h3><ul class="aw-list"><li>逐脚本执行与断言结果</li><li>产品回退、异常恢复的真实证据</li><li>调测报告与产物清单</li><li>执行追踪、输入快照及消耗记录</li><li>证据校验结论与人工交付决定</li></ul></section></div><h3>这个资产包里具体有什么？</h3><div class="table-scroll"><table class="data-table aw-table"><thead><tr><th>定义文件</th><th>承载内容</th></tr></thead><tbody><tr><td><code>workflow.json</code></td><td>步骤、分支、人工中断点、步骤输入输出与跳转条件。</td></tr><tr><td><code>input.schema.json / output.schema.json</code></td><td>规格、脚本、产品包与环境引用；产物及验证结果的结构。</td></tr><tr><td><code>recovery-policy.json</code></td><td>超时、重试、幂等条件、暂停恢复和副作用查证约束。</td></tr><tr><td><code>capabilities.json</code></td><td>所需工具能力、可恢复协议、网络及运行时要求；不保存凭证明文。</td></tr><tr><td><code>evaluation-cases.json</code></td><td>正常、失败、边界及人工分支的回放样例与预期。</td></tr></tbody></table></div><p class="tiny muted">以上为本原型建议的资产包结构，尚未实现对应的执行引擎或真实文件导出。</p>`;}
function workflowRecoveryBody(){return `<div class="aw-human-gate">${icon('users')}<div><strong>1个必需的人工交付确认点</strong><p>步骤05由实际任务责任人处理。Agent可准备依据，不能替人批准或绕过拒绝结论。</p></div></div><div class="table-scroll"><table class="data-table aw-table"><thead><tr><th>触发情况</th><th>流程处理</th><th>是否可自动继续</th></tr></thead><tbody><tr><td>缺少转测／环境前置</td><td>返回工作台等待，标明缺项、责任及影响。</td><td>补齐后由工作台重新核验；仅已授权自动执行时派发。</td></tr><tr><td>只读探测超时</td><td>仅在工具声明幂等且策略允许时重试，示例上限2次。</td><td>通过则继续；超限挂起待处理，不无限重试。</td></tr><tr><td>脚本断言失败</td><td>保存失败与诊断；产品恢复动作按已批准的边界执行。</td><td>不能因回退成功而改写测试失败，需整改和重新验证。</td></tr><tr><td>副作用结果未知</td><td>查询已有操作或job状态；无法查证则转人工。</td><td>不得盲目重放安装、提交或下发等操作。</td></tr><tr><td>输入变化／额度耗尽</td><td>保留执行检查点与旧基线，停止新增调用；按能力释放资源。</td><td>恢复前重新核验输入、权限和预算；不能沿用失效证据。</td></tr><tr><td>人工拒绝／取消</td><td>记录决定及原因，退回整改；远端作业按真实取消能力处理。</td><td>不能自动改成通过，不能将取消请求当作远端已停止。</td></tr></tbody></table></div><p class="tiny muted">这些是Workflow声明的规则，由工作台和执行适配器落实。当前原型只模拟其中的就绪、暂停、输入变更与交付确认行为。</p>`;}
function workflowBindingBody(){return `<div class="aw-binding-level"><span>定义层</span><div><h3>Harness Workflow @2.1.0</h3><p>定义步骤、输入输出契约、能力要求、错误分支、人工点和评测样例。通过能力名称声明需求，不固化真实人员、环境地址或凭据。</p></div></div><div class="aw-binding-level"><span>组合层</span><div><h3>路由特性验证组合 @${state.assetVersion}</h3><p>引用本Workflow与特性验证小队@2.3.0，绑定脚本执行、组网适配、证据采集等Skill的固定版本及知识选取规则。组合验收检查它们能否协同工作。</p>${button('查看场景组合','asset-detail','text','data-value="0"')}</div></div><div class="aw-binding-level"><span>执行层</span><div><h3>WK-204 · 产品验证空间</h3><p>绑定林澈的授权、当前运行时、personal-lc-02、实际产品包和额度；每次执行冻结具体输入与资产版本。</p></div></div><div class="callout mt">${icon('info')}<span>Workflow可以由不同小队或单Agent使用；小队也可以按不同任务使用多个Workflow。一个步骤对工具能力的要求，不等于已经授权任何Agent调用它。</span></div><h3>与全局研发依赖图的区别</h3><p>01—11c是跨角色、跨系统的业务交付链；本Workflow只执行07b这项事务内部的调测方法，不接管其他环节，也不把09工厂部署加入07b硬前置。</p>`;}
function workflowReleaseBody(){return `<div class="between mb"><div class="flex">${badge('v2.1.0','outline')}${badge('演示验收记录','green')}</div><span class="tiny muted">EV-083 · 样例与记录均为原型数据</span></div><div class="table-scroll"><table class="data-table aw-table"><thead><tr><th>评测场景</th><th>检查输入／事件</th><th>预期结果</th></tr></thead><tbody>${featureDebugWorkflow.checks.map(c=>`<tr>${c.map(t=>`<td>${t}</td>`).join('')}</tr>`).join('')}</tbody></table></div><h3>版本与运行的关系</h3><p>2.1.0是流程定义版本，${state.assetVersion}是场景组合版本，${state.attempt?executionLabel(state.attempt.id):'每次任务执行'}是单次执行身份。流程升级需独立评测并形成新版本，组合选择采纳后才影响后续执行，已有运行仍保留原快照。</p><div class="callout">${icon('shield')}<span>流程包评测通过、场景组合验收通过、当前执行成功和当前需求交付是不同结论，不能相互替代。</span></div>`;}
function workflowDetailBody(){const body={steps:workflowStepBody,contract:workflowContractBody,recovery:workflowRecoveryBody,bindings:workflowBindingBody,release:workflowReleaseBody}[workflowDetailView.tab]();return `<div class="aw-definition"><div class="between wrap"><div><p class="aw-kicker">固化执行流程 · 方法资产</p><h3 class="aw-title">feature-debug <span>@2.1.0</span></h3><p class="aw-description">面向07b特性脚本调测，定义如何检查、执行、恢复、验证并交还责任人。</p></div>${badge('Harness Workflow','green')}</div><div class="aw-definition-meta"><span><b>5</b>主步骤</span><span><b>1</b>人工交付确认点</span><span><b>6</b>评测场景</span><span>定义、组合绑定与运行实例分别管理</span></div>${workflowTabs()}<div id="workflow-tab-body">${body}</div></div>`;}
function showWorkflowDetail(){workflowDetailView={tab:'steps',step:0};modal('Harness Workflow · 特性脚本调测流程',workflowDetailBody(),button('关闭','close-modal')+button('查看应用它的示例任务','workflow-task','primary'),true);document.querySelector('.modal').classList.add('workflow-modal');}

function runtimeDetail(id){const r=runtimeById(id);if(!r)return;const m=runtimeMachines.find(m=>m.id===r.machine),e=runtimeEligibility(r),own=r.owner==='林澈';modal(r.label+' · 运行时详情',`<div class="flex wrap mb">${runtimeProvenance(r)}${badge(m&&!m.online?'离线':'在线',m&&!m.online?'amber':'green',true)}</div><dl class="detail-pairs"><dt>实例ID</dt><dd class="mono">${r.id}</dd><dt>执行位置</dt><dd>${m?m.name:'服务执行端（不使用本地Daemon）'}</dd><dt>所有者</dt><dd>${r.owner}</dd><dt>版本观测</dt><dd>${r.version}</dd><dt>协议</dt><dd>${r.protocol}</dd><dt>范围</dt><dd>${r.share==='private'?'仅所有者':r.share==='workspace'?'工作空间共享':'产品验证空间授权'}</dd><dt>能力声明</dt><dd>${r.caps.join(' / ')} · 当前为演示声明</dd><dt>容量</dt><dd>${r.used} / ${r.limit} ${m?'，机器总占用 '+runtimeMachineUsed(m.id)+'/'+m.limit:''}</dd><dt>派发判断</dt><dd>${e.reason}</dd></dl>${r.kind==='service'?'<h3>SDK服务适配契约</h3><p>服务注册标识 testagent-validation；保存服务身份托管引用，接入启动、查询、取消与检查点接口。需核验鉴权、能力版本、请求幂等和结果查证，不能只登记一个URL就宣称可执行。</p>':'<h3>共享与本机凭据</h3><p>共享允许获授权成员将Agent执行路由到此机器，不复制CLI登录凭据。只有运行时所有者能改变共享范围；查看、管理和调用权限分别校验。</p>'}<div class="callout">${icon('layers')}<span>这不是personal-lc-02产品验证环境。选择此运行时不会改变产品包、转测交付或环境安装记录。</span></div>`,button('关闭','close-modal')+(own&&r.kind==='native'?button(r.share==='private'?'共享到工作空间':'收回共享','runtime-sharing','',`data-value="${r.id}"`):'')+button(currentRuntimeId()===r.id?'当前任务已选择':'用于WK-204','runtime-select','primary',`data-value="${r.id}" ${e.allowed?'':'disabled'}`));}
function runtimeSharing(id){const r=runtimeById(id);if(!r||r.owner!=='林澈'||r.kind!=='native'){toast('只有运行时所有者可改变共享范围。');return;}const revoke=r.share==='workspace',affected=revoke&&id==='rt-lc-claude'&&!runtimeManagement().detached;modal(revoke?'收回共享 · 影响预览':'共享运行时 · 确认范围',`<p>${esc(r.label)} · 所有者林澈</p>${revoke?`<p>改为仅所有者后，其他成员不再能绑定此运行时。需先查看受影响的Agent、运行和自动化。</p><dl class="detail-pairs"><dt>受影响Agent</dt><dd>${affected?'文档检查Agent · 陈宁':'无其他成员的已知绑定'}</dd><dt>活动运行</dt><dd>${affected?'共享文档检查执行 · 执行中；1条排队运行':'无其他成员的已知活动运行'}</dd><dt>自动化</dt><dd>${affected?'1条关联自动化将暂停':'无受影响自动化'}</dd></dl><div class="callout amber">${icon('info')}授权撤回与远端进程停止分别确认。离线或失联机器上的进程可能继续，不能把取消请求当作已停止。所有者自己的Agent与运行不在本次收回范围。</div>`:'<p>共享后工作空间成员可按各自Agent访问权限使用该运行时；本机工具账号与机器资源仍由所有者负责，登录凭据不会被复制给其他成员。</p>'}`,button('取消','close-modal')+button(revoke?'确认收回（演示）':'确认共享（演示）','runtime-sharing-confirm','primary',`data-value="${r.id}" data-sharing="${revoke?'private':'workspace'}"`));}
function runtimeSharingConfirm(el){const r=runtimeById(el.dataset.value);if(!r||r.owner!=='林澈')return;const cfg=runtimeManagement();cfg.sharing[r.id]=el.dataset.sharing;if(r.id==='rt-lc-claude'&&el.dataset.sharing==='private')cfg.detached=true;persist();closeModal();render();toast(el.dataset.sharing==='private'?'已收回共享授权；受影响的远端停止结果仍需查证。':'已更新工作空间共享范围。');}

function runtimeProfileSave(){const name=document.getElementById('rp-name')?.value.trim(),command=document.getElementById('rp-command')?.value.trim(),args=document.getElementById('rp-args')?.value.trim(),family=document.getElementById('rp-family')?.value;if(!name||!command){toast('请填写名称与可执行命令。');return;}if(/[|;&<>`\r\n]/.test(command+' '+args)||/\$\(|%[^%]+%/.test(command+' '+args)){toast('命令配置不能包含Shell操作符或环境变量展开。');return;}const cfg=runtimeManagement();cfg.profiles.push({id:'PROFILE-'+String(cfg.profiles.length+1).padStart(3,'0'),name,command,args,family,discovered:false});persist();closeModal();runtimeView.tab='profiles';go('runtimes');toast('配置已登记；尚未发现命令，未创建可派发实例。');}

function discussionStore(){if(!state.discussion)state.discussion={entries:[
 {id:'comment-seed-human',kind:'comment',author:'林澈',actor:'human',label:'任务责任人',at:'2026-10-20T09:20:00+08:00',text:'本次调测面向动态路由新特性。请先确认开发正式交付转测，并核验个人环境实际安装的产品版本，再运行脚本。'},
 {id:'comment-seed-leader',kind:'comment',author:'验证小队 Leader',actor:'agent',label:'特性验证小队',at:'2026-10-20T09:25:00+08:00',text:'07a脚本已提交。当前等待开发转测确认和个人环境版本核验，07b尚未启动。前置满足后，将由Script Agent执行调测并提交报告。',tag:'准备阶段 · 未派发'}
 ]};for(const r of [...(state.attempts||[]),...(state.attempt?[state.attempt]:[])]){if(!state.discussion.entries.some(c=>c.kind==='run'&&c.runId===r.id))state.discussion.entries.push({id:'run-import-'+r.id,kind:'run',runId:r.id,key:r.id+':run',author:'特性验证小队',actor:'agent',at:r.startedAt||'2026-10-20T09:26:00+08:00',imported:true});}return state.discussion;}
function discussionTime(at){return new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(at));}
function addDiscussion(entry){const store=discussionStore();if(entry.key&&store.entries.some(c=>c.key===entry.key))return;store.entries.push({id:'comment-'+Date.now()+'-'+store.entries.length,at:new Date().toISOString(),...entry});persist();}
function discussionAttempt(id){return state.attempt?.id===id?state.attempt:(state.attempts||[]).find(r=>r.id===id);}
function executionLabel(id){const attempts=[...(state.attempts||[]),...(state.attempt?[state.attempt]:[])];const n=attempts.findIndex(r=>r.id===id);return n>=0?'第'+(n+1)+'次执行':({'RUN-0283':'用例生成执行','RUN-0281':'边界样例回放','RUN-SHARED-09':'共享文档检查执行','RUN-0271':'历史示例执行'}[id]||'执行记录');}

 1:{author:'验证小队 Leader',tag:'输入核验',text:'业务前置和授权核验通过。脚本、正式转测交付及个人环境实际产品版本均匹配本次任务。'},
 2:{author:'Script Agent',tag:'输入快照',text:'已装载固定修订的脚本、规格、经验与场景组合。下一步连接personal-lc-02，按照冻结的断言与恢复规则执行。'},
 3:{author:'Script Agent',tag:'执行进展',text:'正在personal-lc-02上执行特性脚本，检查热更新、连接保持与异常回退路径。逐脚本结果和工具日志归入本次执行。'},

 };const r=reports[step];if(r)addDiscussion({kind:'comment',actor:'agent',label:'特性验证小队',runId:id,key:id+':stage:'+step,...r});}
function discussionRunCard(entry){const r=discussionAttempt(entry.runId),current=r?.id===state.attempt?.id&&state.run!=='idle',status=current?state.run:r?.result||'unknown',label=status==='success'?'执行成功':status==='running'?'执行中':status==='paused'?'已暂停':'历史执行',valid=!!r&&r.specRevision===state.specRevision&&state.fresh;return `<article class="discussion-run"><div class="between wrap"><div class="flex">${icon('users')}<strong>特性验证小队</strong>${badge(label,status==='success'?'green':status==='running'?'blue':'amber')}</div><button class="aw-inline-link" data-action="discussion-run" data-value="${esc(entry.runId)}">${executionLabel(entry.runId)} · 执行详情</button></div><p>${esc(r?.runtime||'运行时待核实')} · 输入r${r?.specRevision||'—'} · 组合${esc(r?.assetVersion||'—')}</p><div class="flex wrap tiny">${badge(valid?'输入仍适用':'历史输入 / 待重验证',valid?'outline':'amber')}<span class="muted">成员：Leader协调 / Script Agent执行</span></div></article>`;}
function discussionCommentCard(c){const store=discussionStore(),parent=store.entries.find(p=>p.id===c.parentId),agent=c.actor==='agent';return `<article class="discussion-comment ${agent?'agent-comment':''}" data-comment-id="${esc(c.id)}"><div class="discussion-comment-head"><span class="discussion-avatar ${agent?'agent':''}">${agent?icon(c.author.includes('Leader')?'users':'spark'):'林'}</span><div class="grow"><div class="flex wrap"><strong>${esc(c.author)}</strong>${badge(agent?'Agent':'成员',agent?'blue':'outline')}${c.label?`<span class="tiny muted">${esc(c.label)}</span>`:''}</div><time>${discussionTime(c.at)}${c.runId?' · '+executionLabel(c.runId):''}</time></div>${c.tag?badge(c.tag,c.summary?'green':'outline'):''}</div>${parent?`<blockquote>回复 ${esc(parent.author)}：${esc(parent.text.slice(0,85))}${parent.text.length>85?'…':''}</blockquote>`:''}<div class="discussion-comment-body">${esc(c.text).replaceAll('\n','<br>')}</div>${c.summary?`<div class="discussion-artifacts">${button(icon('book')+'调测报告','discussion-artifact','small',`data-value="${esc(c.runId)}" data-artifact="report"`)}${button(icon('shield')+'恢复证据','discussion-artifact','small',`data-value="${esc(c.runId)}" data-artifact="recovery"`)}</div>`:''}<footer><button class="aw-inline-link" data-action="discussion-reply" data-value="${esc(c.id)}">回复</button>${c.runId?button('查看执行过程 '+icon('arrow'),'discussion-run','text',`data-value="${esc(c.runId)}"`):`<span class="tiny muted">${agent?'执行前检查 · 尚未派发':'任务讨论'}</span>`}</footer></article>`;}
function discussionComposer(){const target=discussionStore().entries.find(c=>c.id===discussionView.replyTo);return `<section class="discussion-composer"><div class="flex mb"><span class="person">林</span><strong class="tiny">林澈</strong><span class="tiny muted">补充上下文或回复执行汇报</span></div>${target?`<div class="discussion-reply-banner"><span>回复 ${esc(target.author)}${target.runId?' · '+executionLabel(target.runId):''}</span><button data-action="discussion-reply-cancel" aria-label="取消回复">${icon('close')}</button></div>`:''}<textarea id="task-comment" class="input" rows="3" maxlength="4000" placeholder="补充要求、提出问题，或回复小队与Agent的汇报…" aria-label="任务评论">${esc(discussionView.text)}</textarea><div class="between wrap mt"><label class="switch"><input id="comment-guide" type="checkbox" ${discussionView.guide&&state.run==='running'?'checked':''} ${state.run==='running'?'':'disabled'}>同时指导当前执行${state.run==='running'?' · '+executionLabel(runId()):'（当前没有正在执行的任务）'}</label>${button('发送评论','discussion-send','primary')}</div><p>普通回复不会重启历史执行。指导信息仅发送到当前正在进行的执行；评论和Agent总结不直接改变业务完成状态。全部为本地模拟。</p></section>`;}
function discussionSystemRow(c){return `<div class="discussion-system">${icon('clock')}<div class="grow"><strong>${esc(c.title)}</strong><p>${esc(c.title==='人工补充执行信息'?c.text:executionNote(c.text))}</p></div><time>${discussionTime(c.at)}</time></div>`;}
function discussionSysGroup(g){if(g.items.length===1)return discussionSystemRow(g.items[0]);const open=!!discussionView.sysExpanded?.[g.key];const head=`<div class="discussion-system discussion-merged">${icon('clock')}<div class="grow"><strong>${esc(g.title)}${badge('×'+g.items.length,'outline')}</strong><p>${esc(g.title==='人工补充执行信息'?g.text:executionNote(g.text))}</p></div><time>${discussionTime(g.at)}</time><button class="aw-inline-link" data-action="discussion-sys-toggle" data-value="${esc(g.key)}" aria-expanded="${open}">${open?'收起':'展开'}</button></div>`;return open?head+g.items.map(discussionSystemRow).join(''):head;}
function coalesceSystemEvents(items){const out=[];for(const it of items){const last=out[out.length-1];const mergeable=it.kind==='system'&&it.sysKind!=='audit';if(mergeable&&last?.kind==='sysgroup'&&last.title===it.title){last.items.push(it);last.at=it.at;last.text=it.text;}else if(mergeable)out.push({kind:'sysgroup',title:it.title,items:[it],at:it.at,text:it.text,key:'grp-'+it.id});else out.push(it);}return out;}
function collapseOldSystemBlocks(items){if(discussionView.sysOldExpanded)return items;const sysIdx=items.map((it,i)=>it.kind==='system'||it.kind==='sysgroup'?i:-1).filter(i=>i>=0);if(sysIdx.length<3)return items;const collapsed=sysIdx.slice(0,-1);if(collapsed.length<2)return items;const cset=new Set(collapsed),count=collapsed.reduce((s,i)=>s+(items[i].kind==='sysgroup'?items[i].items.length:1),0);const out=[];for(let i=0;i<items.length;i++){if(cset.has(i)){if(i===collapsed[0])out.push({kind:'sysold',count});continue;}out.push(items[i]);}return out;}
function taskDiscussion(){const store=discussionStore();const systems=state.activity.filter(taskEventVisible).map((e,i)=>({kind:'system',sysKind:e.kind||systemEventKind(e.title),id:e.id||'legacy-'+i,title:e.title,text:e.note,at:e.at||'2026-10-20T09:24:00+08:00'}));const items=coalesceSystemEvents([...store.entries,...systems].sort((a,b)=>new Date(a.at)-new Date(b.at)));const shown=collapseOldSystemBlocks(items.filter(c=>discussionView.filter==='all'||discussionView.filter==='agents'&&(c.actor==='agent'||c.kind==='run')||discussionView.filter==='humans'&&c.actor==='human'||discussionView.filter==='events'&&(c.kind==='system'||c.kind==='sysgroup')));return `<div class="section-label"><h2>协作动态与执行汇报</h2><div class="flex"><span class="tiny muted">按时间排列 · 同一事务保留全部尝试</span>${button('跳到最新','discussion-latest','small')}</div></div>${tabs([['all','全部'],['agents','小队 / Agent'],['humans','成员评论'],['events','执行事件']],discussionView.filter,'discussion-filter')}<div class="discussion-stream">${shown.map(c=>c.kind==='run'?discussionRunCard(c):c.kind==='sysgroup'?discussionSysGroup(c):c.kind==='system'?discussionSystemRow(c):c.kind==='sysold'?`<button class="discussion-old-toggle" data-action="discussion-old-toggle">${icon('clock')}<span>较早的 ${c.count} 条系统事件 · 点击展开</span>${icon('chevron')}</button>`:discussionCommentCard(c)).join('')||'<div class="empty">暂无此类记录</div>'}</div>${discussionComposer()}`;}
function discussionReply(id){const c=discussionStore().entries.find(c=>c.id===id);if(!c)return;discussionView.replyTo=id;view.taskTab='activity';render();queueAfterRender(()=>document.getElementById('task-comment')?.focus({preventScroll:false}));}
function sendDiscussion(){const text=discussionView.text.trim();if(!text){showFieldError('task-comment','请填写评论内容后再发送。');return;}const parent=discussionStore().entries.find(c=>c.id===discussionView.replyTo);const guide=discussionView.guide&&state.run==='running';addDiscussion({kind:'comment',actor:'human',author:'林澈',label:'任务责任人',text,parentId:parent?.id,runId:guide?runId():parent?.runId,tag:guide?'指导当前执行':undefined});if(guide){event('人工补充执行信息',text);addDiscussion({kind:'comment',actor:'agent',author:'验证小队 Leader',label:'特性验证小队',runId:runId(),tag:'收到补充',text:'已收到本次执行的补充要求，已关联到当前演示执行。原输入快照保持不变；若涉及规格变化，仍需走输入变更确认。'});}discussionView.text='';discussionView.replyTo=null;discussionView.guide=false;render();toast(guide?'评论已发布，并关联当前演示执行。':'评论已发布；未触发新执行。');}
function discussionRunDetail(id){const r=discussionAttempt(id);if(!r){toast('没有找到对应执行快照。');return;}const current=state.attempt?.id===id&&state.run!=='idle',result=current?state.run:r.result,valid=r.specRevision===state.specRevision&&state.fresh;modal(executionLabel(id)+' · 执行快照与日志',`<div class="flex wrap mb">${badge(result==='success'?'执行成功':result==='running'?'执行中':result==='paused'?'已暂停':'历史尝试',result==='success'?'green':'blue')}${badge(valid?'输入仍适用':'历史输入 / 待重验证',valid?'outline':'amber')}</div><dl class="detail-pairs"><dt>小队与成员</dt><dd>特性验证小队 · Leader / Script Agent</dd><dt>运行时</dt><dd>${esc(r.runtime)} / ${esc(r.runtimeId||'历史记录未绑定实例ID')}</dd><dt>冻结输入</dt><dd>规格r${r.specRevision} / 组合${esc(r.assetVersion)} / 脚本e72a8d1</dd><dt>业务交付</dt><dd>${current?taskStatus():'历史记录保留，不能据此完成当前任务'}</dd></dl><div class="execution"><div class="execution-header">${executionLabel(id)} · 工具与执行日志摘要</div><div class="execution-code">${result==='success'?'[01] 输入与权限核验通过\n[02] 执行快照已冻结\n[03] 12条脚本执行完成\n[04] 异常恢复证据已归集\n[05] 结果校验完成；等待独立交付确认':current?'当前进度 '+state.runStep+'/5；原始工具事件归入本次执行。':'按历史执行结果保留对应摘要。'}</div></div><p class="tiny muted mt">生产实现按执行记录关联真实工具事件、过程汇报与结果摘要；原型仅模拟日志。</p>${executionTechnicalDetails(id)}`,button('关闭','close-modal')+(current?button('查看交付证据','discussion-evidence','primary'):''));}
function discussionArtifact(id,type){const r=discussionAttempt(id);if(!r)return;const valid=r.specRevision===state.specRevision&&state.fresh;modal(type==='report'?'特性调测报告':'异常恢复证据',`<dl class="detail-pairs"><dt>来源执行</dt><dd>${executionLabel(id)}</dd><dt>冻结输入</dt><dd>规格r${r.specRevision} / 组合${esc(r.assetVersion)}</dd><dt>结果</dt><dd>12/12通过（演示）；产品包R2.8.0-rc4，环境personal-lc-02。</dd><dt>适用性</dt><dd>${valid?'匹配当前规格，仍需责任人确认交付':'历史证据保留，不能自动满足当前规格'}</dd></dl><p>评论展示产物入口；证据校验与业务交付以工作台的独立记录为准。</p>${executionTechnicalDetails(id)}`,button('关闭','close-modal'));}

function modalFocusables(root=document){const modal=document.querySelector('.modal');if(!modal)return [];return [...modal.querySelectorAll('button:not([disabled]),input:not([disabled]):not([type=hidden]),select:not([disabled]),textarea:not([disabled]),a[href],[tabindex]:not([tabindex="-1"])')].filter(el=>el.offsetWidth||el.offsetHeight||el.getClientRects().length);}

const PROTECTED_INPUTS=['overview-search','work-search','asset-search','experience-search','runtime-search','task-comment','steer-input'];
function compositionTargetProtected(el){return el&&(el.id&&PROTECTED_INPUTS.includes(el.id)||el.dataset?.draftField);}
function flushCompositionDraft(){const el=view.composingEl;if(!el)return;const field=el.dataset?.draftField;if(field&&view[field]!==undefined)view[field]=el.value;else if(el.id==='task-comment')discussionView.text=el.value;else if(el.id==='steer-input')view.steerDraft=el.value;}
function endComposition(rerender){if(!view.composingEl)return;flushCompositionDraft();view.composingEl=null;const pending=view.pendingRender;view.pendingRender=false;if(rerender&&pending)render();}
function skipRenderDuringComposition(){const el=view.composingEl;if(!el)return false;if(!el.isConnected){endComposition(false);return false;}view.pendingRender=true;return true;}
document.addEventListener('compositionstart',e=>{if(compositionTargetProtected(e.target))view.composingEl=e.target;});
document.addEventListener('compositionend',e=>{if(view.composingEl===e.target)endComposition(true);});
function runAfterRender(){const q=view.afterRender||[];view.afterRender=[];for(const fn of q)try{fn();}catch{}}
function queueAfterRender(fn){(view.afterRender||=[]).push(fn);}

function defectPage(){const d=defectStore(),eligibility=defectCanStart(),frozen=d.stage!=='new',repro={ 'not-requested':'未要求复现 · 直接定位',pending:'等待复现结果',reproduced:'现象已复现','not-reproduced':'未复现 · 待补充或确认',waived:'未复现 · 已记录继续定位依据'}[d.reproduce];return heading('DEFECT RESOLUTION',defectExample.id+' · '+defectExample.title,'WK-260 · 服务研发空间 · DTS问题单直接进入开发定位与修复',badge(defectStatus(),statusType(defectStatus()),true))+`<div class="stats">${stat('来源状态',defectNativeStatus(),'DTS原生状态单独映射 · 演示')}${stat('问题输入','修订 r'+d.revision,d.inputVerified?'现象、附件及代码基线已核验':'输入待核验')}${stat('复现策略',d.reproduce==='not-requested'?'按需启用':'已启用',repro)}${stat('需求关联','未绑定SR/RR','缺陷可独立闭环，不强制补造需求')}</div><div class="callout mb">${icon('branch')}<span><strong>问题单 →〔可选：现象复现〕→ 定位 → 修改 → 开发自测 → 独立验证 → DTS闭环。</strong><br>不经过SA／SE需求分析与设计。定位发现架构性问题时，可另发设计协作事项，不作为每个缺陷的固定前置。</span></div><div class="grid-main"><div><div class="defect-actions panel coordination-pad mb"><div class="between wrap"><span class="tiny muted">${esc(eligibility.reason)}</span>${defectAction()}</div></div>${panel('问题输入与附件',`<dl class="detail-pairs"><dt>问题现象</dt><dd>并发配置热更新时，少量长连接被提前释放；现场日志含旧会话关闭事件。</dd><dt>问题版本</dt><dd>${defectExample.observedVersion} · 按缺陷现场判断，不强制等待新特性rc4转测</dd><dt>代码基线</dt><dd>${defectExample.code}</dd><dt>附件</dt><dd>${defectExample.attachments.map((name,i)=>button(name,'defect-attachment','text',`data-value="${i}"`)).join('<br>')}</dd><dt>来源关系</dt><dd>DTS-842 ↔ WK-260；产品／版本范围可关联，SR／RR可选。问题现象、附件和修订以DTS为准。</dd></dl>${button(d.inputVerified?'重新核验输入':'核验问题输入','defect-input','small')}`)}<div class="mt">${panel('可选分支 · 问题现象复现',`<label class="switch"><input id="defect-reproduce" type="checkbox" ${d.reproduce!=='not-requested'?'checked':''} ${frozen?'disabled':''}>定位前先安排问题复现</label><p>${repro}</p><p class="tiny muted">未要求复现时，直接消费问题单现象和附件。选择复现后记录环境、步骤和结果；未复现不等于缺陷不存在，也不伪装为复现通过。</p>${!frozen&&d.reproduce!=='not-requested'?button('提交复现结果（演示）','defect-repro-result','small'):''}${d.reproduce==='not-reproduced'&&!frozen?button('说明依据并继续 function startDefect(kind='diagnose'){const d=state.defect;if(!defectCanStart().allowed||!['new','paused','diagnosed'].includes(d.stage))return;if(kind==='fix'&&d.stage!=='diagnosed')return;let a=d.attempts.at(-1);const resume=d.stage==='paused';if(resume){if(!a||a.revision!==d.revision||a.runtimeId!==d.runtimeId){toast('原执行基线不匹配，需重新确认输入。');return;}kind=a.kind;}else{a={id:'DTS-EXEC-'+(++d.sequence),kind,revision:d.revision,runtimeId:d.runtimeId,runtime:runtimeById(d.runtimeId).label,reproduce:d.reproduce,code:defectExample.code,result:'running'};d.attempts.push(a);}a.result='running';d.stage='running';const generation=++defectGeneration;defectEvent(resume?'恢复问题单执行':kind==='diagnose'?'开发定位已启动':'修复草稿生成已启动','冻结问题单r'+d.revision+'、附件及代码基线；'+(d.reproduce==='not-requested'?'未要求先复现，直接依据现象与附件分析。':'保留复现结果和继续定位依据。'));defectTimer=setTimeout(()=>{if(generation!==defectGeneration)return;defectTimer=null;a.result='success';d.stage=kind==='diagnose'?'diagnosed':'fixed';defectEvent(kind==='diagnose'?'定位结果待开发人员核验':'修复草稿已形成，等待开发自测',kind==='diagnose'?'演示定位假设：旧配置清理与会话引用释放存在竞态。需要核验日志、调用链和代码差异，不能将未复现作为已复现证据。':'演示产物：修复差异草稿、引用生命周期检查及并发回归用例建议。尚未执行真实代码修改，也未关闭DTS。');render();},1400);persist();render();}

function opsCurrentQualityPanel(){const s=qualitySummary('RR-110');return panel('当前版本质量台账 · 与比较队列分开',`<div class="between wrap mb"><strong class="tiny">${s.closed}/${s.records.length}项已闭环 · ${s.open}项待测试复核 · ${s.advisory}项改进建议</strong>${badge('需求覆盖 1 / '+reqs.length,'amber')}</div><div class="oe-quality-types">${Object.entries(qualityTypes).filter(([k])=>k!=='all').map(([key,label])=>`<button data-action="requirement-e2e" data-value="RR-110"><span>${label}</span><b>${s.records.filter(q=>q.type===key).length}</b></button>`).join('')}</div><p class="tiny muted mt">RR-110质量示例按来源与原始编号去重；其他需求未映射，不能推导版本整体缺陷密度或零缺陷。发现阶段、引入阶段、整改和复核可在需求E2E中追溯。</p>`);}

function opsWorkData(){const c=opsCohorts[view.opsGroup]||opsCohorts.all,metrics=opsMetricRows(c);return `<div class="oe-cohort"><div><strong>固定比较队列 · ${c.name}</strong><p>基线组与改进组：同产品R2.8、同PI、同事务类型与复杂度分层的示例队列。两组各${c.tasks}条交付样本；不作为当前版本实时进展。</p></div><label class="flex tiny">资源组 <select id="ops-resource-group" class="select">${Object.entries(opsCohorts).map(([id,x])=>`<option value="${id}" ${c===x?'selected':''}>${x.name}</option>`).join('')}</select></label></div><div class="stats">${metrics.map(m=>stat(m.label,Math.round(m.now*10)/10+m.unit,m.sample)).join('')}</div><div class="oe-grid mt"><div>${panel('质量与效率一起比较',`<div class="oe-chart-legend"><span><i class="oe-old"></i>基线组</span><span><i class="oe-new"></i>改进组</span><span>各指标使用各自单位与比例尺</span></div><div class="oe-comparisons">${metrics.map(m=>{const max=Math.max(m.old,m.now)*1.15;return `<div class="oe-comparison"><div class="between"><strong>${m.label}</strong>${button('口径与证据','ops-metric','small',`data-value="${m.id}"`)}</div><div class="oe-bar-row"><span>基线</span><div><i class="oe-old" style="width:${m.old/max*100}%"></i></div><b>${Math.round(m.old*10)/10}${m.unit}</b></div><div class="oe-bar-row"><span>改进</span><div><i class="oe-new" style="width:${m.now/max*100}%"></i></div><b>${Math.round(m.now*10)/10}${m.unit}</b></div></div>`;}).join('')}</div><p class="tiny muted mt">观察到的差异只用于提出改进假设；样本规模、任务难度及人员/环境差异仍需复核，不能直接宣称由AI带来。</p>`)}<div class="mt">${panel('作业时间分解',`<div class="oe-timebar">${c.times.map((n,i)=>`<span class="oe-time-${i}" style="width:${n/c.wait[2]*100}%" title="${['依赖等待','有效处理','返工','复核与验证'][i]} ${n}h">${Math.round(n/c.wait[2]*100)}%</span>`).join('')}</div><div class="oe-time-labels">${c.times.map((n,i)=>`<span><i class="oe-time-${i}"></i>${['依赖等待','有效处理','返工','复核与验证'][i]} ${n}h</span>`).join('')}</div><p class="tiny muted mt">改进组按事务历时累计${c.wait[2]}h，各片段互斥。这里是事务历时，不是人力工时；并行事务按各自身份统计。</p>` )}</div><div class="mt">${opsCurrentQualityPanel()}</div></div><aside>${panel('数据覆盖与在途风险',`<h3>${c.coverage}</ function provenanceDetail(record,data){if(!record)return '<div class="empty-filter">选择左侧步骤，查看该时点的基线、差异与原始事件。</div>';const snapshot=data.snapshots[record.snapshot]||{},previous=data.events.find(e=>e.id===record.previousEventId),diff=provenanceDiff(data.snapshots[previous?.snapshot]||{},snapshot);return `<div class="pt-inspector"><div class="flex wrap">${badge(record.kind==='human'?'人工决策':record.kind==='effect'?'生效证据':record.kind==='ack'?'接收回执':'可观测事件','outline')}${badge(record.origin,'outline')}</div><h3>${esc(record.title)}</h3><p>${esc(record.summary||'')}</p><dl class="detail-pairs"><dt>执行与步骤</dt><dd>${record.executionId?esc(executionLabel(record.executionId)):'执行前准备'} · ${record.stage?'步骤 '+record.stage:'准备阶段'}</dd><dt>前驱／决策</dt><dd>${esc(record.previousEventId||'无前驱')} / ${esc(record.decisionId||'无显式决策关联')}</dd><dt>资产</dt><dd>${esc(snapshot.assets?.combination||'未采集')} · ${esc(snapshot.assets?.harness||'未采集')}</dd><dt>运行时</dt><dd>${esc(snapshot.runtime?.id||'未采集')} · 版本${esc(snapshot.runtime?.verifiedVersion||'未核验')}</dd><dt>环境／包</dt><dd>${esc(snapshot.environment?.id||'未采集')} · ${esc(snapshot.environment?.observedPackage||'未采集')}</dd><dt>数据边界</dt><dd>事件时间与采集时间分别保留。缺少的工具明细、镜像、模型或摘要不推断补齐。</dd></dl><h4>相邻可观测快照差异</h4>${diff.length?diff.map(d=>`<div class="pt-diff"><strong>${esc(d.field)}</strong><p>${esc(typeof d.before==='object'?JSON.stringify(d.before):d.before)} → ${esc(typeof d.after==='object'?JSON.stringify(d.after):d.after)}</p></div>`).join(''):'<p class="tiny muted">无已采集差异；这不证明所有未采集状态均未改变。</p>'}<details class="pt-raw"><summary>原始事件与快照（本地记录）</summary><pre>${esc(JSON.stringify({event:record,snapshot},null,2))}</pre></details><p class="tiny muted">保留的是可审计指令、工具结果引用及摘要，不包含模型隐藏推理。原型仅为本地记录，不具备防篡改或可信签名。</p></div>`;}

function provenanceStageName(stage){return ['准备','输入核验','基线装载','脚本执行','证据归集','结果校验'][stage||0]||'步骤';}
function provenanceEmptyGuide(){const canRun=ready()&&runtimeDispatchable()&&taskDispatchPolicy().allowed&&!state.delivered&&['idle','paused'].includes(state.run);return `<div class="pt-empty-guide"><div class="pt-empty-art" aria-hidden="true"><span class="pt-empty-node done"></span><span class="pt-empty-line"></span><span class="pt-empty-node done"></span><span class="pt-empty-line"></span><span class="pt-empty-node ${state.run==='running'?'live':canRun?'next':'wait'}"></span><span class="pt-empty-line dim"></span><span class="pt-empty-node wait"></span><span class="pt-empty-line dim"></span><span class="pt-empty-node wait"></span></div><h3>${state.attempt?'本次执行尚未产生新事件':'Trace 在执行开始后自动采集'}</h3><p>${state.attempt?'执行正在进行或刚恢复；步骤、暂停/恢复、人工决策与消费事件会实时出现在左侧时间线。':'启动受管执行后，这里会逐步形成可追溯的时间线：基线冻结 → 五个执行步骤 → 人工干预与生效证据。每次尝试独立冻结输入、资产与运行时快照。'}</p><div class="pt-empty-actions">${state.attempt?'':button(icon('play')+(state.run==='paused'?'恢复受管执行':'启动受管执行'),'run','primary',canRun?'':'disabled')}${button('查看独立溯源示例','provenance-sample','', 'data-value="sample"')}${button('查看前置与输入','task-tab','','data-value="dependencies"')}</div><p class="tiny muted">也可从协作动态中任一次执行的“查看执行过程”进入；旧尝试不补造历史。</p></div>`;}
function executionTraceView(){const data=provenanceData(),analysis=provenanceAnalysis(data.events),records=data.events.filter(e=>provenanceView.filter==='all'||provenanceView.filter==='human'&&['human','ack','effect'].includes(e.kind)||provenanceView.filter==='change'&&(e.kind==='change'||e.kind==='effect'&&e.snapshot!==data.events.find(x=>x.id===e.previousEventId)?.snapshot)),selected=data.events.find(e=>e.id===provenanceView.selected)||records.at(-1),ids=[...new Set([...provenanceStore().events.map(e=>e.executionId),...(state.attempts||[]).map(e=>e.id),state.attempt?.id].filter(Boolean))];const liveAttempt=provenanceView.dataset==='live'&&state.attempt&&['running','paused'].includes(state.run),progress=liveAttempt?Math.min(state.runStep||0,5):null;return `<section class="pt-workspace"><div class="between wrap mb"><div><h2>执行过程与Trace溯源</h2><p class="tiny muted mt">任务 → 执行尝试 → 步骤／事件 → 当时基线 → 人工决策与生效证据</p></div><div class="flex wrap"><select id="provenance-dataset" class="select"><option value="live" ${provenanceView.dataset==='live'?'selected':''}>本任务本地采集记录</option>${ids.map(id=>`<option value="${esc(id)}" ${provenanceView.dataset===id?'selected':''}>${executionLabel(id)}</option>`).join('')}<option value="sample" ${provenanceView.dataset==='sample'?'selected':''}>独立溯源示例（非实际执行）</option></select>${button('记录人工决策','provenance-decision','small',!state.attempt||!['running','paused'].includes(state.run)||provenanceView.dataset==='sample'?'disabled':'')}</div></div>${liveAttempt?`<div class="pt-progress" role="status" aria-label="当前执行进度 ${progress}/5"><div class="pt-progress-head"><span class="live-dot"></span><strong>${executionLabel(state.attempt.id)} 执行中</strong><span class="tiny muted">${provenanceStageName((state.runStep||0)+1)} · ${progress}/5</span></div><div class="pt-progress-bar"><span style="width:${progress/5*100}%"></span></div><div class="pt-progress-steps">${['输入核验','基线装载','脚本执行','证据归集','结果校验'].map((n,i)=>`<span class="${i<progress?'done':i===progress?'curr function provenanceHumanView(data,a){return `<div class="stats">${stat('人工决策',a.humans.length,'普通评论不自动归为干预')}${stat('已收到',a.ack.length,'仅代表已接收指令')}${stat('有生效链',a.effective.length,'需显式决策引用与变化证据')}${stat('影响待验证',a.pending.length,'不等于没有价值')}</div><div class="mt">${a.humans.map(h=>{const links=data.events.filter(e=>e.decisionId===h.id);return `<article class="panel pt-decision mb"><div class="between wrap"><h3>${esc(h.title)}</h3>${badge(h.effectScope||'待查证作用域','outline')}</div><p>${esc(h.summary)}</p><p class="tiny muted">${esc(h.actor)} · ${discussionTime(h.eventAt)} · ${esc(h.proposal||'原提案见事件摘要')} → ${esc(h.choice||'选择见事件摘要')}</p><p class="tiny muted">依据：${esc(h.reason||'独立样本中的可观测说明')}</p><div class="pt-receipts"><span>提出 ${h.id}</span><span>→ ${links.find(e=>e.kind==='ack')?.id||'等待接收回执'}</span><span>→ ${links.find(e=>e.kind==='effect')?.id||'等待生效证据'}</span></div>${button('查看原始依据','provenance-select','small',`data-value="${h.id}"`)}</article>`;}).join('')||'<p class="muted">暂无结构化人工决策。执行中指导、暂停、恢复及后续基线选择会分别留痕。</p>'}</div><div class="callout mt">${icon('info')}<span>只凭时序无法证明因果。有明确决策关联和路径变化，也仍需质量、时长、代价及反事实／对照证据才能判断净收益。</span></div>`;}
function provenanceAnalysisView(data,a){const changed=new Set();let previous;for(const e of data.events){const s=data.snapshots[e.snapshot];if(previous)for(const d of provenanceDiff(previous,s))changed.add(d.field);previous=s;}return `<div class="stats">${stat('可观测事件',data.events.length,'按事件身份保留')}${stat('步骤记录',a.steps.length,'原型为5个聚合步骤')}${stat('变化字段',changed.size,'含后续配置与实际观察，分域解释')}${stat('有生效链的决策',a.effective.length,'不直接换算为效率收益')}</div><div class="info-grid mt"><div class="info-box"><h3>路径影响分析</h3><p class="tiny muted mt">${a.conclusion}</p><p class="tiny muted mt">${a.pending.length}条决策尚无生效链。真实并行关键路径需要父子步骤、依赖边和开始／结束时间；当前事件序列及采集间隔不能当作真实工具耗时或节省工时。</p></div><div class="info-box"><h3>可进入下一轮评测的材料</h3><p class="tiny muted mt">保留原始事件ID、输入与资产修订、运行时／环境快照、人工原提案与选择、Agent回执和生效事实。将未知项与备选方案一并作为样本约束，不直接训练或发布。</p>${button('生成改进候选草稿','provenance-candidate','primary mt',data.events.length?'':'disabled')}</div></div><details class="pt-raw mt"><summary>查看分析输入与派生结论</summary><pre>${esc(JSON.stringify({dataset:provenanceView.dataset,sourceEventIds:data.events.map(e=>e.id),derived:{decisions:a.humans.map(e=>e.id),acknowledged:a.ack.map(e=>e.id),effective:a.effective.map(e=>e.id),pending:a.pending.map(e=>e.id),changedFields:[...changed]},limitation:'非因果收益证明；未采集步骤及配置不推断补齐'},null,2))}</pre></details>`;}
function provenanceOpen(id){provenanceView.dataset=id&&discussionAttempt(id)?id:'live';view.taskTab='trace';go('task');}

function provenanceCandidate(){const data=provenanceData(),a=provenanceAnalysis(data.events);if(!data.events.length)return;const bundle={events:structuredClone(data.events),snapshots:Object.fromEntries([...new Set(data.events.map(e=>e.snapshot))].map(ref=>[ref,structuredClone(data.snapshots[ref])]))};let candidate={consumptionAnalysis:consumptionAnalysis(data.events),evidenceKey:provenanceCanonical({dataset:provenanceView.dataset,eventIds:data.events.map(e=>e.id),analyzerVersion:'trace-rules-v2'}),analyzerVersion:'trace-rules-v2',sourceBundle:bundle,id:'TR-IMP-'+(provenanceStore().candidates.length+1),dataset:provenanceView.dataset==='sample'?'sample':'local',status:'候选草稿',eventIds:data.events.map(e=>e.id),snapshotRefs:[...new Set(data.events.map(e=>e.snapshot))],decisionIds:a.humans.map(e=>e.id),effectIds:data.events.filter(e=>e.kind==='effect').map(e=>e.id),analysis:'完善前置核验／人工决策接收与生效检查；先用证据确认具体改进对象。',limitation:a.conclusion,validationPlan:'固定任务、输入、资产、运行时及环境；回放原提案、人工选择和失败反例，比较质量、等待、人工投入与全部成本。未知配置先补齐，未通过返回候选。',at:new Date().toISOString()};const existing=provenanceStore().candidates.find(c=>c.evidenceKey===candidate.evidenceKey);candidate=existing||candidate;if(!existing)provenanceStore().candidates.push(candidate);persist();modal(candidate.id+' · 改进候选草稿',`<p>${candidate.dataset==='sample'?'来自独立示例，不能计入实际作业效果。':'来自本任务本地可观测记录。'}</p><p>${candidate.analysis}</p><p>${candidate.validationPlan}</p><details class="pt-raw"><summary>候选依据与分析边界</summary><pre>${esc(JSON.stringify(candidate,null,2))}</pre></details><p>已保留事件与快照引用；没有创建批准资产、修改流程或发布云见经验。</p>`,button('关闭','close-modal')+button('进入数据飞轮','ops-domain','primary','data-value="flywheel"'));}

const startBeforeProvenance=startRun;
startRun=function(){const before=state.run,oldId=state.attempt?.id;startBeforeProvenance();if(state.run!=='running')return;if(before==='running')return;const id=state.attempt.id;if(oldId!==id||!provenanceStore().events.some(e=>e.key===id+':start')){provenanceAppend({kind:'step',title:oldId===id?'开始观测已有尝试':'执行基线冻结',spanId:'root:'+id,key:id+':start',summary:oldId===id?'开始观测原尝试；已有输入/资产字段可引用，历史环境及步骤明细不能回填。':'冻结实际输入、资产引用与运行时；环境观察和缺失项单列。'});}else{const h=provenanceAppend({kind:provenanceView.startTrigger==='human'?'human':'observation',title:provenanceView.startTrigger==='human'?'人工恢复原执行':'策略恢复原执行',actor:provenanceView.startTrigger==='human'?'林澈':'调度策略',effectScope:'原尝试，保持原运行时与资产',summary:'恢复原尝试调度；本地快捷恢复不替代正式动态授权核验。'});provenanceAppend({kind:'effect',title:'本地调度恢复',decisionId:h.kind==='human'?h.id:null,summary:'已恢复原尝试的演示调度，不表示迁移到后续所选运行时。'});}persist();render();};

  rec:'补充信息',conf:64,why:'证据链完整（5 条记录引用），但 2 条记录来自旧网关版本，适用范围需确认',
  contra:'旧版本样本占比 40%，直接入库可能高估当前网关的适用性',
  src:'知识Agent · 1小时前'},
 {id:'DP-110',kind:'改进回退',task:'IC-024 知识装配配额调整',ask:'上线观察指标回退（上下文溢出告警回升），Agent 申请回退到上一资产版本',
  rec:'批准回退',conf:91,why:'观察第 9 天告警回到调整前水平，假设未成立',
  contra:'回退影响 3 个空间的装配策略，其中 1 个空间近期无执行（影响待确认）',
  src:'运营Agent · 2小时前'}];
function decisionInboxView(){
 return `<section class="panel mb" style="border-left:3px solid var(--amber,#d97706)">
 <div class="panel-head"><h2>决策收件箱 <span class="tiny muted">· ${decisionPkgs.length} 个 Agent 进程等你表态（L2：Agent 执行 · 人决策）</span></h2>
 <span class="tiny muted">先处理表态，再看队列 · 推荐人≠决策人 · 否决/复核留痕</span></div>
 ${decisionPkgs.map(d=>`<div class="risk-item"><div class="between"><div>
 <h3>${badge(d.kind,d.kind==='转测交付'?'green':d.kind==='知识固化'?'teal':'amber')} ${d.id} · ${d.task}</h3>
 <p>${d.ask}</p>
 <p class="tiny">AI 推荐：<strong>${d.rec}</strong>（置信度 ${d.conf}%）—— ${d.why}</p>
 <p class="tiny" style="color:var(--amber,#b45309)">⚠ 反方证据：${d.contra}</p>
 <p class="tiny muted">${d.src}</p></div>
 <div class="flex">${button('打开决策包','decide-open','primary small',`data-value="${d.id}"`)}</div></div></div>`).join('')}
 <div class="callout">${icon('info')}决策包 = 事项 + 证据 + 可解释推荐 + 反方证据；批准/否决（理由必填）/补充信息/跳作业台现场四类操作均留痕。自动化程度分级演进（L2→L3 白名单自动+上线观察），每级可回退。</div></section>`;
}
Object.assign(actions,{
 'decide-open':el=>{const d=decisionPkgs.find(x=>x.id===el.dataset.value);modal(`${d.id} ${d.kind} · 决策包`,`<p>${d.ask}</p>
 <dl class="detail-pairs"><dt>AI 推荐</dt><dd>${d.rec}（置信度 ${d.conf}%）</dd><dt>推荐依据</dt><dd>${d.why}</dd><dt>反方证据</dt><dd style="color:var(--amber,#b45309)">${d.contra}</dd><dt>来源</dt><dd>${d.src}</dd></dl>
 <p class="tiny muted">操作留痕：批准 / 否决（理由必填，回写任务现场）/ 补充信息（Agent 续作时消费）/ 我要亲自看（跳作业台现场）。AI 永远不是裁决人。</p>`,
 button('批准','decide-approve')+button('否决·理由必填','decide-reject')+button('补充信息','decide-info')+button('关闭','close-modal'));},
 'decide-approve':()=>{closeModal();render();toast('已批准：裁决留痕已写入任务现场，Agent 将继续推进');},
 'decide-reject':()=>{closeModal();render();toast('已登记否决：需填写理由，Agent 收到后转入整改分支');},
 'decide-info':()=>{closeModal();render();toast('已打开补充信息表单：Agent 续作时将消费你补充的上下文');}
});
render();
</script>
